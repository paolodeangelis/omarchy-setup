<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by omarchy-setup: normalize a Mac PowerPoint full-face name. -->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>CMU Serif Roman</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>CMU Serif</string>
    </edit>
    <edit name="style" mode="assign" binding="strong">
      <string>Roman</string>
    </edit>
  </match>
</fontconfig>
