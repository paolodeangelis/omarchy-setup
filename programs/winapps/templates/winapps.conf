_winapps_credentials="${XDG_CONFIG_HOME:-$HOME/.config}/winapps/credentials.env"
if [[ -r "$_winapps_credentials" ]]; then
  # shellcheck source=/dev/null
  source "$_winapps_credentials"
fi
unset _winapps_credentials

RDP_USER="${USERNAME:-}"
RDP_PASS="${PASSWORD:-}"
RDP_ASKPASS=""
RDP_DOMAIN=""
RDP_IP="127.0.0.1"
RDP_PORT="3389"
RDP_TIMEOUT="120"
REMOVABLE_MEDIA="/run/media"
WAFLAVOR="podman"
RDP_SCALE="140"
RDP_FLAGS="/cert:tofu /sound +home-drive -grab-keyboard"
RDP_FLAGS_NON_WINDOWS="/cert:tofu /sound +home-drive -grab-keyboard"
RDP_FLAGS_WINDOWS="/cert:tofu /sound +home-drive -grab-keyboard"
DEBUG="true"
AUTOPAUSE="off"
FREERDP_COMMAND="xfreerdp3"
