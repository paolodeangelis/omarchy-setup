[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-setup"
version = "0.1.0"
description = "Personal, reproducible setup framework for Omarchy"
requires-python = ">=3.11"

[project.scripts]
omarchy-setup = "omarchy_setup.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
