name: Omarchy 4.0.4

on:
  push:
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional official stable release to test
        type: string
        default: ''
      upgrade_from:
        description: Reviewed older baseline for a one-time upgrade drill
        type: choice
        options:
          - current
          - '4.0.3'
        default: current

permissions:
  contents: read

concurrency:
  group: omarchy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast project checks
    runs-on: ubuntu-24.04
    outputs:
      pre_commit: ${{ steps.pre_commit.outcome }}
      compile: ${{ steps.compile.outcome }}
      unit_integration: ${{ steps.unit_integration.outcome }}
      bootstrap_cli: ${{ steps.bootstrap_cli.outcome }}
      installer_cli: ${{ steps.installer_cli.outcome }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run the same checks as pre-commit
        id: pre_commit
        continue-on-error: true
        run: |
          python -m pip install pre-commit==4.2.0
          pre-commit run --all-files --show-diff-on-failure
      - name: Compile Python sources
        id: compile
        continue-on-error: true
        run: python -m compileall -q src tests
      - name: Run unit and integration tests
        id: unit_integration
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Exercise bootstrap CLI parsing
        id: bootstrap_cli
        continue-on-error: true
        run: ./omarchy-setup init -y --help >/dev/null
      - name: Exercise program installer CLI parsing
        id: installer_cli
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m omarchy_setup install all -y --help >/dev/null
      - name: Fail when a fast check failed
        env:
          PRE_COMMIT: ${{ steps.pre_commit.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          UNIT_INTEGRATION: ${{ steps.unit_integration.outcome }}
          BOOTSTRAP_CLI: ${{ steps.bootstrap_cli.outcome }}
          INSTALLER_CLI: ${{ steps.installer_cli.outcome }}
        run: |
          for result in "$PRE_COMMIT" "$COMPILE" "$UNIT_INTEGRATION" "$BOOTSTRAP_CLI" "$INSTALLER_CLI"; do
            [[ $result == success ]] || exit 1
          done

  release:
    name: Resolve newest stable Omarchy
    runs-on: ubuntu-24.04
    outputs:
      baseline: ${{ steps.release.outputs.baseline }}
      candidate: ${{ steps.release.outputs.candidate }}
      run_candidate: ${{ steps.release.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve official release and ISO checksum
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate || '' }}
          BASELINE: ${{ inputs.upgrade_from == '4.0.3' && '4.0.3' || '' }}
        run: python3 tests/vm/resolve.py latest --candidate "$CANDIDATE" --baseline "$BASELINE" --output release.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-detection
          path: release.json

  version_baseline:
    name: Omarchy ${{ needs.release.outputs.baseline }}
    needs: [checks, release]
    uses: ./.github/workflows/omarchy-system.yml
    with:
      mode: pinned
      baseline: ${{ needs.release.outputs.baseline }}

  fresh_candidate:
    name: Fresh Omarchy ${{ needs.release.outputs.candidate }}
    needs:
      - checks
      - release
    if: needs.release.outputs.run_candidate == 'true'
    uses: ./.github/workflows/omarchy-system.yml
    with:
      mode: latest
      candidate: ${{ needs.release.outputs.candidate }}
      baseline: ${{ needs.release.outputs.baseline }}

  upgrade_candidate:
    name: Upgrade ${{ needs.release.outputs.baseline }} to ${{ needs.release.outputs.candidate }}
    needs:
      - checks
      - release
    if: needs.release.outputs.run_candidate == 'true'
    uses: ./.github/workflows/omarchy-system.yml
    with:
      mode: upgrade
      candidate: ${{ needs.release.outputs.candidate }}
      baseline: ${{ needs.release.outputs.baseline }}

  winapps:
    name: WinApps basic compatibility
    needs:
      - checks
      - release
    if: >-
      always() &&
      needs.checks.result == 'success' &&
      needs.release.result == 'success'
    uses: ./.github/workflows/winapps-smoke.yml
    with:
      candidate: ${{ needs.release.outputs.candidate }}

  report:
    name: At-a-glance report
    needs:
      - checks
      - release
      - version_baseline
      - fresh_candidate
      - upgrade_candidate
      - winapps
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download acceptance records and diagnostics
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: omarchy-*
          path: report-input
      - name: Write compatibility summary
        env:
          CANDIDATE: ${{ needs.release.outputs.candidate }}
          BASELINE: ${{ needs.release.outputs.baseline }}
          CHECKS: ${{ needs.checks.result }}
          PRE_COMMIT: ${{ needs.checks.outputs.pre_commit }}
          COMPILE: ${{ needs.checks.outputs.compile }}
          UNIT_INTEGRATION: ${{ needs.checks.outputs.unit_integration }}
          BOOTSTRAP_CLI: ${{ needs.checks.outputs.bootstrap_cli }}
          INSTALLER_CLI: ${{ needs.checks.outputs.installer_cli }}
          RELEASE: ${{ needs.release.result }}
          VERSION_BASELINE: ${{ needs.version_baseline.result }}
          FRESH_CANDIDATE: ${{ needs.fresh_candidate.result }}
          UPGRADE_CANDIDATE: ${{ needs.upgrade_candidate.result }}
          WINAPPS: ${{ needs.winapps.result }}
        run: python3 tests/vm/report.py report-input
