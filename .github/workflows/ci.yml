name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run the same checks as pre-commit
        run: |
          python -m pip install pre-commit==4.2.0
          pre-commit run --all-files --show-diff-on-failure
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run unit and integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Exercise bootstrap CLI parsing
        run: ./omarchy-setup init -y --help >/dev/null
      - name: Exercise program installer CLI parsing
        env:
          PYTHONPATH: src
        # The launcher deliberately requires init for non-bootstrap commands.
        # This fast job checks parsing; installed-launcher checks run in the VM.
        run: python -m omarchy_setup install all -y --help >/dev/null
