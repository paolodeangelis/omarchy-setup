name: Omarchy release check

on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: omarchy-release-check
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.release.outputs.candidate }}
      action: ${{ steps.dispatch.outputs.action || steps.already.outputs.action || steps.current.outputs.action }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/vm/resolve.py latest --output release.json
      - uses: actions/cache/restore@v4
        if: steps.release.outputs.run == 'true'
        id: dispatched
        with:
          path: .release-dispatched
          key: omarchy-release-dispatched-v2-${{ steps.release.outputs.candidate }}
      - name: Run the complete suite once for the new release
        id: dispatch
        if: steps.release.outputs.run == 'true' && steps.dispatched.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run omarchy-tests.yml --ref "$DEFAULT_BRANCH" -f candidate="$CANDIDATE"
          echo "$CANDIDATE" > .release-dispatched
          echo 'action=dispatched' >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.release.outputs.run == 'true' && steps.dispatched.outputs.cache-hit != 'true'
        with:
          path: .release-dispatched
          key: omarchy-release-dispatched-v2-${{ steps.release.outputs.candidate }}
      - name: Report no new release
        id: current
        if: steps.release.outputs.run != 'true'
        run: echo 'action=no-new-release' >> "$GITHUB_OUTPUT"
      - name: Report previously dispatched release
        id: already
        if: steps.release.outputs.run == 'true' && steps.dispatched.outputs.cache-hit == 'true'
        run: echo 'action=already-dispatched' >> "$GITHUB_OUTPUT"

  report:
    name: At-a-glance report
    needs: detect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write release-check summary
        env:
          RESULT: ${{ needs.detect.result }}
          CANDIDATE: ${{ needs.detect.outputs.candidate }}
          ACTION: ${{ needs.detect.outputs.action }}
        run: |
          case "$RESULT" in
            success) display='✅ success' ;;
            cancelled) display='⚪ cancelled' ;;
            *) display="❌ $RESULT" ;;
          esac
          {
            echo '# Omarchy release report'
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Release detection | $display |"
            echo "| Official stable version | ${CANDIDATE:-unresolved} |"
            echo "| Action | ${ACTION:-not reached} |"
          } >> "$GITHUB_STEP_SUMMARY"
