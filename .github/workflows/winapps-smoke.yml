name: Shared WinApps basic compatibility execution

on:
  workflow_call:
    inputs:
      candidate:
        description: Omarchy release whose upgrade run requested this companion smoke
        type: string
        default: ''
permissions:
  contents: read

concurrency:
  group: winapps-smoke-${{ inputs.candidate || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Provision direct-KVM smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            podman podman-compose crun passt uidmap slirp4netns xvfb xdotool imagemagick \
            openssl netcat-openbsd git
          sudo chmod 0666 /dev/kvm /dev/net/tun
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build pinned FreeRDP 3
        run: |
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config zlib1g-dev libssl-dev \
            libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxkbfile-dev \
            libxrandr-dev libxi-dev libxrender-dev libxfixes-dev libxdamage-dev \
            libxtst-dev libxv-dev
          git clone --filter=blob:none --no-checkout \
            https://github.com/FreeRDP/FreeRDP.git "${RUNNER_TEMP}/freerdp"
          git -C "${RUNNER_TEMP}/freerdp" fetch --depth=1 origin \
            63b948ca5cb94307fd5444ee6e73927a41ccdab4
          git -C "${RUNNER_TEMP}/freerdp" checkout --detach \
            63b948ca5cb94307fd5444ee6e73927a41ccdab4
          test "$(git -C "${RUNNER_TEMP}/freerdp" rev-parse HEAD)" = \
            63b948ca5cb94307fd5444ee6e73927a41ccdab4
          cmake --preset minimal-client -S "${RUNNER_TEMP}/freerdp" \
            -B "${RUNNER_TEMP}/freerdp-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF -DWITH_SERVER=OFF -DWITH_SHADOW=OFF \
            -DWITH_PROXY=OFF -DWITH_CLIENT_SDL=OFF -DWITH_WEBVIEW=OFF \
            -DWITH_SAMPLE=OFF -DCHANNEL_RDPECAM_CLIENT=OFF
          cmake --build "${RUNNER_TEMP}/freerdp-build" --parallel 2
          sudo cmake --install "${RUNNER_TEMP}/freerdp-build"
          sudo ldconfig
          xfreerdp3 /version
      - name: Boot ephemeral Windows and open built-in RemoteApps
        env:
          WINAPPS_ARTIFACTS: ${{ runner.temp }}/winapps-artifacts
        run: |
          bash tests/winapps/smoke.sh
          for evidence in result.txt notepad.png edge.png \
              notepad-window-title.txt edge-window-title.txt; do
            test -s "${WINAPPS_ARTIFACTS}/${evidence}"
          done
      - name: Record evidence boundary
        if: always()
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          {
            echo '### WinApps compatibility layer'
            echo "Associated Omarchy candidate: ${CANDIDATE:-manual/PR run}"
            echo 'This direct-KVM job validates pinned WinApps, Podman, FreeRDP, Notepad, and Edge.'
            echo 'The preceding configured-upgrade job validates omarchy-setup inside upgraded Omarchy.'
            echo 'Windows does not run nested inside that Omarchy VM; same-VM WinApps rendering remains unclaimed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload selected diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winapps-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winapps-artifacts/
          if-no-files-found: warn
          retention-days: 7
