name: WinApps built-in application smoke

on:
  workflow_call:
    inputs:
      candidate:
        description: Omarchy release whose upgrade run requested this companion smoke
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional Omarchy release associated with this smoke
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/winapps-smoke.yml'
      - 'programs/winapps/**'
      - 'src/omarchy_setup/modules/programs/**'
      - 'tests/winapps/**'

permissions:
  contents: read

concurrency:
  group: winapps-smoke-${{ inputs.candidate || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Provision direct-KVM smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            podman podman-compose crun passt uidmap slirp4netns xvfb xdotool imagemagick \
            openssl netcat-openbsd git
          sudo chmod 0666 /dev/kvm /dev/net/tun
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install FreeRDP 3
        run: |
          brew install freerdp
          command -v xfreerdp3 || command -v xfreerdp
      - name: Boot ephemeral Windows and open built-in RemoteApps
        env:
          WINAPPS_ARTIFACTS: ${{ runner.temp }}/winapps-artifacts
        run: bash tests/winapps/smoke.sh
      - name: Record evidence boundary
        if: always()
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          {
            echo '### WinApps compatibility layer'
            echo "Associated Omarchy candidate: ${CANDIDATE:-manual/PR run}"
            echo 'This direct-KVM job validates pinned WinApps, Podman, FreeRDP, Notepad, and Edge.'
            echo 'The preceding configured-upgrade job validates omarchy-setup inside upgraded Omarchy.'
            echo 'Windows does not run nested inside that Omarchy VM; same-VM WinApps rendering remains unclaimed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload selected diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winapps-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winapps-artifacts/
          if-no-files-found: warn
          retention-days: 7
