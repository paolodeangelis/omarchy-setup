name: Watch official Omarchy releases
on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: omarchy-release-watch
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/vm/resolve.py latest --output release.json
      - uses: actions/cache/restore@v4
        if: steps.release.outputs.run == 'true'
        id: sent
        with:
          path: .release-dispatched
          key: omarchy-release-dispatched-v1-${{ steps.release.outputs.candidate }}
      - name: Dispatch both candidate workflows
        if: steps.release.outputs.run == 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run omarchy-upgrade.yml --ref "$DEFAULT_BRANCH" -f candidate="$CANDIDATE"
          gh workflow run omarchy-latest.yml --ref "$DEFAULT_BRANCH" -f candidate="$CANDIDATE"
          echo "$CANDIDATE" > .release-dispatched
      - uses: actions/cache/save@v4
        if: steps.release.outputs.run == 'true' && steps.sent.outputs.cache-hit != 'true'
        with:
          path: .release-dispatched
          key: omarchy-release-dispatched-v1-${{ steps.release.outputs.candidate }}
